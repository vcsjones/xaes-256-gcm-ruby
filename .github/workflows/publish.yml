name: Publish to rubygems.org

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'vcsjones/xaes-256-gcm-ruby'
    runs-on: ubuntu-latest

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/xaes_256_gcm

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
        with:
          ruby-version: '3.4'

      - name: Bundle Install
        run: bundle install --no-color

      - name: Publish to RubyGems
        uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2

      - name: Artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'pkg/*.gem'

      - name: Create GitHub Release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"
          gh release create "${tag_name}" --verify-tag --draft --generate-notes pkg/*.gem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
